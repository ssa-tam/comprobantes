<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <style>
    body { font-family: -apple-system, Segoe UI, Roboto, sans-serif; background:#f5f6f8; margin:0; padding:24px; color:#1f2430; }
    h1 { font-size:20px; margin-bottom:4px; }
    .sub { color:#666; margin-bottom:24px; font-size:13px; }
    .login-box { max-width:320px; margin:80px auto; background:#fff; padding:24px; border-radius:12px; box-shadow:0 2px 10px rgba(0,0,0,.08); }
    .login-box input { width:100%; box-sizing:border-box; padding:10px; margin:6px 0; border:1px solid #ddd; border-radius:8px; }
    .login-box button, .btn { background:#2563eb; color:#fff; border:none; padding:10px 16px; border-radius:8px; cursor:pointer; font-size:14px; }
    .login-box button:hover, .btn:hover { background:#1d4ed8; }
    .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(240px,1fr)); gap:16px; }
    .card { background:#fff; border-radius:12px; padding:18px; box-shadow:0 1px 4px rgba(0,0,0,.08); }
    .card h2 { font-size:16px; margin:0 0 8px; }
    .estado { display:inline-block; font-size:12px; padding:2px 8px; border-radius:999px; margin-bottom:10px; }
    .estado.Generado { background:#dcfce7; color:#166534; }
    .estado.Pendiente { background:#fef3c7; color:#92400e; }
    .card a { display:block; font-size:13px; color:#2563eb; text-decoration:none; margin:4px 0; }
    .error { color:#b91c1c; font-size:13px; margin-top:8px; }
    .modal-bg { position:fixed; inset:0; background:rgba(0,0,0,.4); display:flex; align-items:center; justify-content:center; }
    .modal { background:#fff; border-radius:12px; padding:24px; width:360px; max-height:80vh; overflow:auto; }
    .modal label { display:block; margin:6px 0; font-size:14px; }
    .modal input[type=text] { width:100%; box-sizing:border-box; padding:8px; margin-top:12px; border:1px solid #ddd; border-radius:8px; }
    .modal-actions { margin-top:16px; display:flex; gap:8px; justify-content:flex-end; }
    .btn-secondary { background:#e5e7eb; color:#111; }
    .btn-secondary:hover { background:#d1d5db; }
    .spinner { font-size:13px; color:#666; }
  </style>
</head>
<body>

  <div id="login" class="login-box">
    <h1>Comprobantes Digitales SSA</h1>
    <div class="sub">Panel de administrador</div>
    <input id="u" type="text" placeholder="Usuario">
    <input id="p" type="password" placeholder="Contraseña">
    <button onclick="doLogin()">Entrar</button>
    <div id="loginError" class="error"></div>
  </div>

  <div id="dash" style="display:none">
    <h1>Trimestres</h1>
    <div class="sub">Abre un trimestre para ver su carpeta y Sheet, o para generarlo si aún no existe.</div>
    <div id="grid" class="grid"></div>
  </div>

  <div id="modalRoot"></div>

  <script>
    let creds = null;

    function doLogin() {
      const u = document.getElementById('u').value.trim();
      const p = document.getElementById('p').value;
      document.getElementById('loginError').textContent = '';
      google.script.run
        .withSuccessHandler(list => {
          creds = { u, p };
          document.getElementById('login').style.display = 'none';
          document.getElementById('dash').style.display = 'block';
          render(list);
        })
        .withFailureHandler(err => {
          document.getElementById('loginError').textContent = 'Usuario o contraseña incorrectos.';
        })
        .panelListarTrimestres(u, p);
    }

    function render(list) {
      const grid = document.getElementById('grid');
      grid.innerHTML = '';
      list.forEach(t => {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <h2>${t.trimestre}</h2>
          <span class="estado ${t.estado}">${t.estado}</span>
          ${t.folderId ? `<a href="https://drive.google.com/drive/folders/${t.folderId}" target="_blank">📁 Ver carpeta en Drive</a>` : ''}
          ${t.sheetId ? `<a href="https://docs.google.com/spreadsheets/d/${t.sheetId}" target="_blank">📊 Ver Sheet de accesos</a>` : ''}
          ${t.bonos ? `<div class="sub">Carpetas especiales: ${t.bonos}</div>` : ''}
        `;
        const btn = document.createElement('button');
        btn.className = 'btn';
        btn.style.marginTop = '10px';
        btn.textContent = t.estado === 'Generado' ? 'Abrir' : 'Generar este trimestre';
        btn.onclick = () => t.estado === 'Generado' ? abrirTrimestre(t) : preguntarCarpetasEspeciales(t.trimestre);
        card.appendChild(btn);
        grid.appendChild(card);
      });
    }

    function abrirTrimestre(t) {
      if (t.folderId) window.open('https://drive.google.com/drive/folders/' + t.folderId, '_blank');
    }

    function preguntarCarpetasEspeciales(trimestre) {
      google.script.run.withSuccessHandler(sugeridos => {
        const modalRoot = document.getElementById('modalRoot');
        const checks = sugeridos.map(b => `
          <label><input type="checkbox" value="${b}"> ${b}</label>
        `).join('');
        modalRoot.innerHTML = `
          <div class="modal-bg">
            <div class="modal">
              <h2>${trimestre}</h2>
              <div class="sub">¿Este trimestre tiene carpetas especiales (bonos)? Márcalas o escribe una nueva.</div>
              ${checks}
              <input id="bonoLibre" type="text" placeholder="Otra carpeta especial (opcional)">
              <div class="modal-actions">
                <button class="btn btn-secondary" onclick="cerrarModal()">Cancelar</button>
                <button class="btn" onclick="confirmarGenerar('${trimestre}')">Generar</button>
              </div>
              <div id="genStatus" class="spinner"></div>
            </div>
          </div>`;
      }).panelGetBonosSugeridos(creds.u, creds.p);
    }

    function cerrarModal() {
      document.getElementById('modalRoot').innerHTML = '';
    }

    function confirmarGenerar(trimestre) {
      const modal = document.querySelector('.modal');
      const checked = Array.from(modal.querySelectorAll('input[type=checkbox]:checked')).map(c => c.value);
      const libre = document.getElementById('bonoLibre').value.trim();
      if (libre) checked.push(libre);

      document.getElementById('genStatus').textContent = 'Generando estructura de carpetas y Sheet... esto puede tardar un par de minutos.';
      google.script.run
        .withSuccessHandler(res => {
          cerrarModal();
          google.script.run.withSuccessHandler(render).panelListarTrimestres(creds.u, creds.p);
        })
        .withFailureHandler(err => {
          document.getElementById('genStatus').textContent = 'Error: ' + err.message;
        })
        .panelGenerarTrimestre(creds.u, creds.p, trimestre, checked);
    }
  </script>
</body>
</html>
